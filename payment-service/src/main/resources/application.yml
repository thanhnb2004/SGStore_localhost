spring:
  application:
    name: payment-service

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: consul-client
      port: 8500
      config:
        enabled: true
        format: yaml
        prefix: config
        default-context: application
        profile-separator: '-'
        request-connect-timeout: 5000
        request-read-timeout: 5000
        fail-fast: true
        retry:
          max-attempts: 10
          initial-interval: 5000
          max-interval: 10000
          multiplier: 1.1

      discovery:
        enabled: true
        register: true
        fail-fast: false
        register-health-check: false
        prefer-ip-address: true
        ip-address: 192.168.21.147
        port: 8085
        retry:
          max-attempts: 10
          initial-interval: 5000
          max-interval: 10000
          multiplier: 1.1


#restart